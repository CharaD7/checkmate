version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkmate
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: checkmate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "checkmate"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-10T08-18-05Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://checkmate:secretpassword@postgres:5432/checkmate_db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "3003:3003"
    command: pnpm run start:dev

  detection:
    build:
      context: ./apps/detection
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://checkmate:secretpassword@postgres:5432/checkmate_db
    ports:
      - "4000:4000"
    command: npm run start:dev

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000
    command: npm start

volumes:
  pgdata:
  miniodata:
