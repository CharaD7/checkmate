services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkmate
      POSTGRES_PASSWORD: checkmate-local
      POSTGRES_DB: checkmate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkmate -d checkmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql://checkmate:checkmate-local@postgres:5432/checkmate
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "3003:3003"
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
